<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin | Dennis Espinosa</title>

    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicons/site.webmanifest">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <main class="admin-page" id="adminPage" hidden>

        <section class="admin-shell">

            <header class="admin-header">
                <p class="admin-kicker">
                    ADMIN
                </p>

                <h2>
                    reset center
                </h2>
            </header>

            <section class="reset-list">

                <div class="reset-row">
                    <div>
                        <h2>gallery</h2>
                        <p>reset gallery reactions.</p>
                    </div>

                    <button type="button" data-reset="gallery">
                        reset
                    </button>
                </div>

                <div class="reset-row wall-reset-row">
                    <div>
                        <h2>wall</h2>
                        <p>reset wall notes.</p>
                    </div>

                    <div class="wall-admin-actions">
                        <button type="button" data-reset="wall">
                            reset
                        </button>

                        <button
                            type="button"
                            class="wall-toggle-btn"
                            id="wallToggleBtn"
                            aria-label="Show wall notes"
                            aria-expanded="false"
                        >
                            ⌄
                        </button>
                    </div>
                </div>

                <div class="wall-notes-panel" id="wallNotesPanel" hidden>
                    <p class="wall-notes-status" id="wallNotesStatus">
                        loading notes...
                    </p>

                    <div class="wall-notes-list" id="wallNotesList"></div>
                </div>

                <div class="reset-row">
                    <div>
                        <h2>word</h2>
                        <p>reset the last word.</p>
                    </div>

                    <button type="button" data-reset="word">
                        reset
                    </button>
                </div>

                <div class="reset-row">
                    <div>
                        <h2>blitzclick</h2>
                        <p>reset blitzclick scores.</p>
                    </div>

                    <button type="button" data-reset="blitzclick">
                        reset
                    </button>
                </div>

                <div class="reset-row">
                    <div>
                        <h2>dontblink</h2>
                        <p>reset dontblink scores.</p>
                    </div>

                    <button type="button" data-reset="dontblink">
                        reset
                    </button>
                </div>

            </section>

            <p class="admin-status" id="adminStatus"></p>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>

</body>
</html>
