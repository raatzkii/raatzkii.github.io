<body>
    <main class="contact-page">
        <section class="contact-hero" aria-label="Contact">
            <div class="contact-layout">
                <figure class="contact-figure">
                    <div class="contact-frame-stage" id="contactFrameStage">
                        <div class="contact-frame-mask">
                            <img class="contact-mask-image" src="assets/in-transit1.avif" alt="Dennis riding transit">
                        </div>
                        <img class="contact-frame" src="assets/frame.png" alt="" aria-hidden="true">
                    </div>
                </figure>

                <section class="contact-panel" aria-label="Contact options">
                    <div class="contact-copy">
                        <p class="contact-kicker">
                            <span class="contact-copy-line contact-copy-line--black">whether</span>
                            <span class="contact-copy-line contact-copy-line--black">you're here to</span>
                            <span class="contact-copy-line contact-copy-line--black">connect</span>
                            <span class="contact-copy-line contact-copy-line--black">or just</span>
                            <span class="contact-copy-line contact-copy-line--black">look around</span>
                        </p>
                        <h1 class="contact-title">
                            <span class="contact-highlight">
                                <span class="contact-copy-line contact-copy-line--green">i'd call that </span>
                                <span class="contact-copy-line contact-copy-line--green">a win.</span>
                            </span>
                        </h1>
                    </div>

                    <div class="contact-action-stack">
                        <button class="message-button" type="button" id="messageButton">
                            + choose a channel
                        </button>

                        <div class="contact-choice-divider">
                            <span>or</span>
                        </div>

                        <button class="message-button burger-button" type="button" id="burgerButton" aria-label="Buy me a burger">
                            + buy me a burger
                        </button>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <div class="contact-form-modal" id="contactFormModal" hidden>
        <div class="contact-form-backdrop" data-contact-modal-close></div>

        <div class="contact-form-card contact-qr-card" role="dialog" aria-modal="true" aria-label="Contact channel QR codes">
            <button class="contact-modal-close" type="button" data-contact-modal-close aria-label="Close contact channels">
                ×
            </button>

            <div class="qr-channel-list" data-qr-panel="channels">
                <section class="qr-channel">
                    <div class="qr-placeholder qr-placeholder--image" aria-label="Viber QR code">
                        <img src="assets/vrqr.png" alt="Viber QR code">
                    </div>
                    <p>viber</p>
                </section>

                <span class="qr-divider" aria-hidden="true"></span>

                <section class="qr-channel">
                    <div class="qr-placeholder qr-placeholder--image" aria-label="WhatsApp QR code">
                        <img src="assets/waqr.png" alt="WhatsApp QR code">
                    </div>
                    <p>whatsapp</p>
                </section>

                <span class="qr-divider" aria-hidden="true"></span>

                <section class="qr-channel">
                    <div class="qr-placeholder qr-placeholder--image" aria-label="Telegram QR code">
                        <img src="assets/tgqr.png" alt="Telegram QR code">
                    </div>
                    <p>telegram</p>
                </section>
            </div>

            <div class="qr-channel-list qr-channel-list--burger" data-qr-panel="burger" hidden>
                <section class="qr-channel">
                    <div class="qr-placeholder qr-placeholder--image" aria-label="GCash QR code">
                        <img src="assets/gcqr.png" alt="GCash QR code">
                    </div>
                    <p>gcash</p>
                </section>

                <span class="qr-divider" aria-hidden="true"></span>

                <section class="qr-channel">
                    <div class="qr-placeholder qr-placeholder--image" aria-label="PayPal QR code">
                        <img src="assets/ppqr.png" alt="PayPal QR code">
                    </div>
                    <p>paypal</p>
                </section>
            </div>
        </div>
    </div>

    <aside class="sticky-cv-banner" aria-label="CV download banner">
        <button class="sticky-cv-close" type="button" aria-label="Close CV banner">×</button>
        <a href="assets/DennisEspinosa_2026_CV.pdf" download aria-label="Download Dennis Espinosa CV">
            <img src="assets/sticky.avif" alt="Get a copy of my CV here">
        </a>
    </aside>

    <div class="mobile-cv-popup" id="mobileCvPopup" aria-label="CV download popup" hidden>
        <div class="mobile-cv-popup-backdrop"></div>
        <div class="mobile-cv-popup-card">
            <button class="mobile-cv-popup-close" type="button" id="mobileCvPopupClose" aria-label="Close CV popup">×</button>
            <a href="assets/DennisEspinosa_2026_CV.pdf" download aria-label="Download Dennis Espinosa CV">
                <img src="assets/stickymob.avif" alt="Get a copy of my CV">
            </a>
        </div>
    </div>
