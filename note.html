<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ok, 'Noted' | Dennis Espinosa</title>

    <meta
        name="description"
        content="A public wall for sharing short messages and leaving your trace behind. Explore Dennis Espinosa's site that reflects more than a decade of diverse experience in the creative field."
    >

    <link rel="shortcut icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicons/site.webmanifest">
    <link rel="stylesheet" href="note.css">
</head>
<body>

    <main class="portfolio-page wall-page">

        <a href="play.html" class="interact-cta back-to-interact">
            <span class="cta-arrow">←</span> back
        </a>

        <div class="wall-center">

            <button class="wall-note-trigger">
                + leave a note
            </button>

            <p class="wall-cooldown" id="wallCooldown"></p>

            <p class="wall-fineprint">
                notes are public and may be removed without notice.
            </p>

        </div>

        <div class="wall-notes"></div>

        <div class="note-composer" id="noteComposer" aria-hidden="true">

            <div class="composer-box">

                <textarea 
                    id="noteInput"
                    maxlength="120"
                    placeholder="Write something..."
                ></textarea>

                <div class="composer-footer">
                    <span id="charCount">0/120</span>

                    <div class="composer-actions">
                        <button id="cancelNote">Cancel</button>
                        <button id="postNote">Post</button>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="note.js"></script>
</body>
</html>
