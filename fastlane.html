<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Lane | Dennis Espinosa</title>

    <meta
        name="description"
        content="A mobile reaction challenge inspired by racing lights and split-second timing. Explore Dennis Espinosa's site that reflects more than a decade of diverse experience in the creative field."
    >

    <link rel="canonical" href="https://raatzkii.com/fastlane.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dennis Espinosa">
    <meta property="og:title" content="Fast Lane | Dennis Espinosa">
    <meta property="og:description" content="A mobile reaction challenge inspired by racing lights and split-second timing. Explore Dennis Espinosa's site that reflects more than a decade of diverse experience in the creative field.">
    <meta property="og:url" content="https://raatzkii.com/fastlane.html">
    <meta property="og:image" content="https://raatzkii.com/assets/favicons/android-chrome-512x512.png">
    <meta property="og:image:alt" content="Dennis Espinosa site preview">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Fast Lane | Dennis Espinosa",
      "description": "A mobile reaction challenge inspired by racing lights and split-second timing. Explore Dennis Espinosa's site that reflects more than a decade of diverse experience in the creative field.",
      "url": "https://raatzkii.com/fastlane.html",
      "image": "https://raatzkii.com/assets/favicons/android-chrome-512x512.png",
      "isPartOf": {
        "@type": "WebSite",
        "name": "Dennis Espinosa",
        "url": "https://raatzkii.com/"
      },
      "author": {
        "@type": "Person",
        "name": "Dennis Espinosa",
        "jobTitle": "Creative Lead",
        "url": "https://raatzkii.com/"
      },
      "publisher": {
        "@type": "Person",
        "name": "Dennis Espinosa",
        "jobTitle": "Creative Lead",
        "url": "https://raatzkii.com/"
      }
    }    </script>

    <link rel="shortcut icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicons/site.webmanifest">
    <link rel="stylesheet" href="fastlane.css">
    <link rel="stylesheet" href="activity-device-gate.css">
    <script src="activity-device-gate.js" data-activity-device="mobile"></script>
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
    <link rel="stylesheet" href="back-arrow.css">
</head>
<body>
    <main class="fastlane-page">
        <a href="play.html" class="interact-cta back-to-play">
            <img class="cta-arrow back-arrow-icon" src="assets/arrow-left.svg" alt="" aria-hidden="true"> back
        </a>

        <button
            class="leaderboard-toggle"
            id="leaderboardToggle"
            type="button"
            aria-label="Show leaderboard"
        >
            <i class="hgi hgi-stroke hgi-rounded hgi-analytics-01"></i>
        </button>

        <section class="fastlane-start" id="fastlaneStart">
            <button class="fastlane-start-btn" id="fastlaneStartBtn" type="button">
                + full throttle
            </button>
        </section>

        <section class="fastlane-game" id="fastlaneGame" aria-label="Fastlane reaction game" hidden>
            <div class="fastlane-stage">
                <div class="fastlane-lights" aria-hidden="true">
                    <span class="fastlane-light"></span>
                    <span class="fastlane-light"></span>
                    <span class="fastlane-light"></span>
                    <span class="fastlane-light"></span>
                    <span class="fastlane-light"></span>
                    <span class="fastlane-light"></span>
                </div>

                <p class="fastlane-status" id="fastlaneStatus">wait for green</p>
            </div>
        </section>

        <section class="fastlane-result" id="fastlaneResult" hidden>
            <div class="fastlane-result-card" id="fastlaneResultCard">
                <p class="fastlane-result-text" id="fastlaneResultText">too soon</p>

                <form class="fastlane-score-form" id="fastlaneScoreForm" hidden>
                    <input
                        id="fastlaneNickname"
                        type="text"
                        maxlength="16"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="nickname"
                        required
                    >

                    <button id="fastlaneSubmitScore" type="submit">
                        submit
                    </button>
                </form>

                <p class="fastlane-score-status" id="fastlaneScoreStatus"></p>

                <button class="fastlane-exit-result" id="fastlaneExitResult" type="button" hidden>
                    exit
                </button>
            </div>

            <button class="fastlane-try-again" id="fastlaneTryAgain" type="button" hidden>
                + try again
            </button>
        </section>

        <div class="leaderboard-modal" id="leaderboardModal" hidden>
            <div class="leaderboard-card">
                <button
                    class="modal-close-btn"
                    id="closeLeaderboardBtn"
                    type="button"
                    aria-label="Close leaderboard"
                >
                    ×
                </button>

                <p class="leaderboard-label">leaderboard</p>

                <ol class="leaderboard-list" id="leaderboardList">
                    <li>
                        <span>checking...</span>
                        <strong>0ms</strong>
                    </li>
                </ol>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="fastlane.js"></script>
</body>
</html>
