<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Quest | Dennis Espinosa</title>

    <meta
        name="description"
        content="A location photo quest built around movement, discovery, and community. Explore Dennis Espinosa's site that reflects more than a decade of diverse experience in the creative field."
    >

    <link rel="shortcut icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicons/site.webmanifest">
    <link rel="stylesheet" href="sidequest.css">
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
</head>
<body>
    <main class="sidequest-page">
        <a href="play.html" class="interact-cta back-to-play">
            <span class="cta-arrow">←</span> back
        </a>

        <section class="sidequest-gate" id="sidequestGate">
            <div class="sidequest-copy">
                <button class="sidequest-primary" id="startQuestBtn" type="button">
                    + explore now
                </button>
                <div class="sidequest-choice-divider">
                    <span>or</span>
                </div>
                <button class="sidequest-primary" id="viewOthersBtn" type="button">
                    + view community
                </button>
                <p class="sidequest-status" id="gateStatus" aria-live="polite"></p>
            </div>
        </section>

        <section class="sidequest-compass" id="sidequestCompass" hidden>
            <div class="sidequest-compass-group">
                <div class="sidequest-arrow-wrap">
                    <i class="hgi hgi-stroke hgi-rounded hgi-circle-arrow-up-02" id="questArrow" aria-hidden="true"></i>
                </div>

                <p class="sidequest-distance" id="questDistance">locating...</p>
                <button class="sidequest-primary sidequest-proof-btn" id="captureMomentBtn" type="button" hidden>
                    capture moment
                </button>
            </div>
        </section>

        <section class="sidequest-feed" id="sidequestFeed" hidden>
            <div class="sidequest-posts" id="sidequestPosts"></div>
        </section>

        <div class="sidequest-modal" id="proofModal" hidden>
            <div class="sidequest-modal-card" id="proofPreviewStep">
                <button class="modal-close-btn" id="closeProofModal" type="button" aria-label="Close proof modal">
                    ×
                </button>

                <img class="proof-preview" id="proofPreview" alt="Proof preview">

                <button class="sidequest-submit" id="openShareStepBtn" type="button">
                    share
                </button>
            </div>

            <form class="sidequest-modal-card" id="proofForm" hidden>
                <button class="modal-close-btn" id="closeShareModal" type="button" aria-label="Close share modal">
                    ×
                </button>

                <input
                    class="sidequest-input"
                    id="proofNickname"
                    maxlength="24"
                    placeholder="nickname"
                    autocomplete="nickname"
                >

                <label class="sidequest-check">
                    <input id="shareAnonymous" type="checkbox">
                    <span>share anonymously</span>
                </label>

                <button class="sidequest-submit" id="submitProofBtn" type="submit">
                    share
                </button>

                <p class="sidequest-status" id="proofStatus" aria-live="polite"></p>
            </form>
        </div>

        <div class="sidequest-modal" id="postedModal" hidden>
            <div class="sidequest-modal-card sidequest-posted-card">
                <p class="sidequest-posted-text">image posted</p>
                <button class="sidequest-submit" id="viewPostedBtn" type="button">
                    view
                </button>
                <button class="sidequest-primary" id="nextLocationBtn" type="button">
                    next location
                </button>
            </div>
        </div>

        <div class="sidequest-modal" id="postDetailModal" hidden>
            <div class="sidequest-detail-card">
                <button class="modal-close-btn" id="closePostDetail" type="button" aria-label="Close post detail">
                    ×
                </button>
                <img class="sidequest-detail-image" id="postDetailImage" alt="">
                <div class="sidequest-detail-copy">
                    <p id="postDetailDate"></p>
                    <p id="postDetailAuthor"></p>
                </div>
            </div>
        </div>

        <input id="proofInput" type="file" accept="image/*" capture="environment" hidden>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="sidequest.js"></script>
</body>
</html>
